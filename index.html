  const btn = e.target.closest('.filter'); if (!btn) return;
  activeFilter = btn.dataset.f;
  $$('#filters .filter').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  $$('#projGrid .proj').forEach(card => {
    const show = activeFilter === 'all' || card.dataset.tags.split(' ').includes(activeFilter);
    card.classList.toggle('is-hidden', !show);
    if (show) { card.classList.add('in'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop'); }
  });
});

/* =========================================================
   CERTIFICATE MODAL
   ========================================================= */
const modal = $('#certModal');
let mCert = null, mIdx = 0;
function drawMedia() {
  const imgs = certImgs(mCert);
  if (!imgs.length) { $('#mMedia').innerHTML = `<div class="modal-ph">${icon('image')}<span>${esc(ui('cert.noimg'))}</span></div>`; return; }
  const multi = imgs.length > 1;
  $('#mMedia').innerHTML = `<img src="${esc(imgs[mIdx])}" alt="${esc(t(mCert.t))} (${mIdx + 1}/${imgs.length})">` + (multi
    ? `<button type="button" class="m-nav m-prev" data-step="-1" aria-label="${esc(ui('prev'))}">${icon('arrow')}</button>
       <button type="button" class="m-nav m-next" data-step="1" aria-label="${esc(ui('next'))}">${icon('arrow')}</button>
       <div class="m-dots" aria-hidden="true">${imgs.map((_, k) => `<i class="${k === mIdx ? 'on' : ''}"></i>`).join('')}</div>` : '');
}
function stepMedia(d) {
  const n = certImgs(mCert).length; if (n < 2) return;
  mIdx = (mIdx + d + n) % n; drawMedia();
}
$('#certGrid').addEventListener('click', e => {
  const card = e.target.closest('.cert'); if (!card) return;
  const c = mCert = CONTENT.certificates[+card.dataset.i]; mIdx = 0;
  $('#mType').textContent = ui('cert.' + c.kind) + (c.year ? ' · ' + c.year : '') + ' · ' + t(c.by);
  $('#mTitle').textContent = t(c.t);
  $('#mDesc').textContent = t(c.d);
  drawMedia();
  if (typeof modal.showModal === 'function') modal.showModal(); else modal.setAttribute('open', '');
  modal.scrollTop = 0;
});
$('#mMedia').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) stepMedia(+b.dataset.step); });
modal.addEventListener('keydown', e => { if (e.key === 'ArrowRight') stepMedia(1); if (e.key === 'ArrowLeft') stepMedia(-1); });
let swX = null;
$('#mMedia').addEventListener('touchstart', e => { swX = e.touches[0].clientX; }, { passive: true });
$('#mMedia').addEventListener('touchend', e => {
  if (swX == null) return;
  const dx = e.changedTouches[0].clientX - swX; swX = null;
  if (Math.abs(dx) > 40) stepMedia(dx < 0 ? 1 : -1);
}, { passive: true });
$('#mClose').addEventListener('click', () => modal.close ? modal.close() : modal.removeAttribute('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

/* =========================================================
   CONTACT: copy email, placeholders, mailto form
   ========================================================= */
const toast = $('#toast'); let toastT = null;
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 1900); }

function copyText(text, msg) {
  const done = () => showToast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallbackCopy);
  else fallbackCopy();
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    ta.remove();
  }
}
function copyEmail() { copyText(CONTENT.email, ui('c.copied')); }

/* ---- Save contact (vCard 3.0) ---- */
const vcEsc = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
const vcFold = line => {
  const enc = new TextEncoder(), out = []; let cur = '', n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 75) { out.push(cur); cur = ' '; n = 1; } cur += ch; n += b; }
  out.push(cur); return out.join('\r\n');
};
/* şəkli kiçildib base64 edir; file:// və ya xəta olarsa null (şəkilsiz davam edir) */
function vcPhoto() {
  return new Promise(resolve => {
    if (!CONTENT.photo) return resolve(null);
    const img = new Image(), timer = setTimeout(() => resolve(null), 4000);
    img.onload = () => {
      try {
        const s = Math.min(320, img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
        c.width = c.height = s;
        const sw = Math.min(img.naturalWidth, img.naturalHeight);
        c.getContext('2d').drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sw) / 2, sw, sw, 0, 0, s, s);
        resolve(c.toDataURL('image/jpeg', .85).split(',')[1] || null);
      } catch (err) { resolve(null); }
      clearTimeout(timer);
    };
    img.onerror = () => { clearTimeout(timer); resolve(null); };
    img.src = CONTENT.photo;
  });
}
async function saveContact() {
  const C = CONTENT, parts = C.name.trim().split(/\s+/), given = parts[0], family = parts.slice(1).join(' ');
  const L = ['BEGIN:VCARD', 'VERSION:3.0',
    `FN;CHARSET=UTF-8:${vcEsc(C.name)}`, `N;CHARSET=UTF-8:${vcEsc(family)};${vcEsc(given)};;;`,
    `ORG;CHARSET=UTF-8:BASKO`, `TITLE;CHARSET=UTF-8:${vcEsc(C.typewriter[lang][1])}`, `ROLE;CHARSET=UTF-8:${vcEsc(C.typewriter[lang][0])}`,
    `TEL;TYPE=CELL,VOICE:${C.phoneHref}`, `EMAIL;TYPE=INTERNET,WORK:${C.email}`,
    `ADR;TYPE=HOME;CHARSET=UTF-8:;;;Bakı;;;Azərbaycan`,
    `URL:${C.site}`];
  ['linkedin', 'instagram'].forEach(id => { const s = C.socials.find(x => x.id === id && x.url); if (s) L.push(`URL:${s.url}`); });
  L.push(`NOTE;CHARSET=UTF-8:${vcEsc(ui('vc.note'))}`);
  const b64 = await vcPhoto();
  if (b64) L.push(`PHOTO;ENCODING=b;TYPE=JPEG:${b64}`);
  L.push('END:VCARD');
  const blob = new Blob([L.map(vcFold).join('\r\n') + '\r\n'], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'ahad-zamanli.vcf'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast(ui('c.saved'));
}
async function shareSite() {
  const data = { title: CONTENT.name, text: ui('c.shareText'), url: CONTENT.site };
  if (navigator.share) {
    try { await navigator.share(data); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  copyText(CONTENT.site, ui('c.linkCopied'));
}
document.addEventListener('click', e => {
  if (e.target.closest('#saveContact')) saveContact();
  if (e.target.closest('#shareSite')) shareSite();
  if (e.target.closest('#copyEmail')) copyEmail();
  if (e.target.closest('[data-soon]')) showToast(ui('soon'));
});

$('#contactForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#fName').value.trim(), from = $('#fEmail').value.trim(), msg = $('#fMsg').value.trim();
  if (!name || !from || !msg) { showToast(ui('form.err')); return; }
  const subject = encodeURIComponent(`Portfolio — ${name}`);
  const body = encodeURIComponent(`${msg}\n\n— ${name} (${from})`);
  window.location.href = `mailto:${CONTENT.email}?subject=${subject}&body=${body}`;
});

/* =========================================================
   COMMAND PALETTE (Ctrl/⌘ + K)
   ========================================================= */
const cmdDlg = $('#cmdDialog'), cmdInput = $('#cmdInput'), cmdList = $('#cmdList'), cmdEmpty = $('#cmdEmpty'), cmdBtn = $('#cmdBtn'), cmdX = $('#cmdX');
let cmdPrev = null, cmdItems = [], cmdShown = [], cmdSel = 0;
$('#cmdKbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘ K' : 'Ctrl K';
/* kiçik hərf + diakritiksiz: "tehsil" → "Təhsil" */
const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ə/g, 'e').replace(/ı/g, 'i');
const uiBoth = k => [CONTENT.ui.az[k], CONTENT.ui.en[k]].filter(Boolean).join(' ');

const CMD_KEY = 'cmdRecent';
function cmdRecent() { try { const a = JSON.parse(localStorage.getItem(CMD_KEY)); return Array.isArray(a) ? a.slice(0, 5) : []; } catch (err) { return []; } }
function cmdRemember(id) { try { localStorage.setItem(CMD_KEY, JSON.stringify([id, ...cmdRecent().filter(x => x !== id)].slice(0, 5))); } catch (err) {} }
function cmdBuild() {
  const items = [];
  SECTIONS.forEach(([id, k]) => {
    const el = document.getElementById(id);
    if (!el || el.hidden) return;
    items.push({ id: 'go:' + id, g: 'cmd.go', ic: 'arrow', label: ui(k), kw: id + ' ' + uiBoth(k), run: () => el.scrollIntoView() });
  });
  $$('#filters .filter').forEach(b => {
    const f = b.dataset.f;
    items.push({ id: 'pf:' + f, g: 'cmd.go', ic: 'code', label: fill(ui('cmd.projTag'), { tag: ui('f.' + f) }), kw: 'projects layihe filter ' + f,
      run: () => { document.getElementById('projects').scrollIntoView(); const nb = $('#filters .filter[data-f="' + f + '"]'); if (nb) nb.click(); } });
  });
  items.push({ id: 'vcard', g: 'cmd.actions', ic: 'download', label: ui('c.save'), kw: 'save contact vcard vcf add contacts kontakt yadda saxla elaqe', run: saveContact });
  items.push({ id: 'share', g: 'cmd.actions', ic: 'share', label: ui('c.share'), kw: 'share link paylas send gonder', run: shareSite });
  items.push({ id: 'theme', g: 'cmd.actions', ic: 'moon', label: ui('theme'), kw: 'theme dark light mode tema qaranliq isiqli', run: () => $('#themeBtn').click() });
  items.push({ id: 'lang', g: 'cmd.actions', ic: 'globe', label: ui('langSwitch'), kw: 'language lang dil az en english azerbaijani', run: () => $('#langBtn').click() });
  items.push({ id: 'copy', g: 'cmd.actions', ic: 'copy', label: ui('c.copy'), kw: uiBoth('c.copy') + ' email mail copy', run: copyEmail });
  CONTENT.socials.filter(s => s.url).forEach(s =>
    items.push({ id: 'soc:' + s.id, g: 'cmd.links', ic: s.id, label: s.n, kw: 'social link ' + s.id, run: () => window.open(s.url, '_blank', 'noopener') }));
  return items;
}
function cmdScore(toks, it) {
  const lb = fold(it.label), hay = lb + ' ' + fold(it.kw);
  let total = 0;
  for (const tk of toks) {
    let i = lb.indexOf(tk);
    if (i >= 0) { total += 200 - i + (i === 0 || lb[i - 1] === ' ' ? 50 : 0); continue; }
    i = hay.indexOf(tk);
    if (i >= 0) { total += 100 - Math.min(i, 90); continue; }
    let p = 0; for (const ch of lb) if (ch === tk[p]) p++;
    if (p === tk.length) { total += 20; continue; }
    return -1;
  }
  return total;
}
function cmdSetSel(i, scroll) {
  cmdSel = i;
  $$('li', cmdList).forEach((li, k) => li.setAttribute('aria-selected', String(k === i)));
  const li = cmdList.children[i];
  if (li) { cmdInput.setAttribute('aria-activedescendant', li.id); if (scroll) li.scrollIntoView({ block: 'nearest' }); }
  else cmdInput.removeAttribute('aria-activedescendant');
}
function cmdRender() {
  const toks = fold(cmdInput.value).trim().split(/\s+/).filter(Boolean);
  if (toks.length) {
    cmdShown = cmdItems.map(it => ({ it, s: cmdScore(toks, it) })).filter(x => x.s >= 0).sort((a, b) => b.s - a.s).map(x => x.it);
  } else {
    const rec = cmdRecent().map(id => cmdItems.find(it => it.id === id)).filter(Boolean).map(it => ({ ...it, g: 'cmd.recent' }));
    cmdShown = rec.concat(cmdItems.filter(it => !rec.some(r => r.id === it.id)));
  }
  cmdList.innerHTML = cmdShown.map((it, i) =>
    `<li role="option" id="cmd-o${i}" aria-selected="false" data-i="${i}">${icon(it.ic)}<span class="cmd-lb">${esc(it.label)}</span><span class="cmd-g">${esc(ui(it.g))}</span></li>`).join('');
  cmdEmpty.hidden = cmdShown.length > 0;
  cmdSetSel(0, true);
}
function cmdClose() { if (cmdDlg.close) cmdDlg.close(); else cmdDlg.removeAttribute('open'); }
function cmdOpen() {
  if (cmdDlg.open || modal.open) return;
  setMenu(false);
  cmdPrev = document.activeElement;
  cmdItems = cmdBuild();
  cmdInput.value = ''; cmdInput.placeholder = ui('cmd.ph');
  if (typeof cmdDlg.showModal === 'function') cmdDlg.showModal(); else cmdDlg.setAttribute('open', '');
  cmdBtn.setAttribute('aria-expanded', 'true');
  cmdRender(); cmdInput.focus();
}
function cmdRun(i) {
  const it = cmdShown[i]; if (!it) return;
  if (it.id) cmdRemember(it.id);
  cmdClose(); it.run();
}
cmdBtn.addEventListener('click', cmdOpen);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdDlg.open ? cmdClose() : cmdOpen(); }
});
cmdInput.addEventListener('input', cmdRender);
cmdDlg.addEventListener('keydown', e => {
  const n = cmdShown.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!n) return;
    cmdSetSel((cmdSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n, true);
  } else if (e.key === 'Enter') { e.preventDefault(); cmdRun(cmdSel); }
  else if (e.key === 'Tab') {
    const f = [cmdInput, cmdX].filter(x => x.offsetParent !== null);
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});
cmdList.addEventListener('click', e => { const li = e.target.closest('li'); if (li) cmdRun(+li.dataset.i); });
cmdList.addEventListener('pointermove', e => { const li = e.target.closest('li'); if (li && +li.dataset.i !== cmdSel) cmdSetSel(+li.dataset.i, false); });
cmdX.addEventListener('click', cmdClose);
cmdDlg.addEventListener('click', e => { if (e.target === cmdDlg) cmdClose(); });
cmdDlg.addEventListener('close', () => {
  cmdBtn.setAttribute('aria-expanded', 'false');
  if (cmdPrev && document.contains(cmdPrev)) cmdPrev.focus({ preventScroll: true });
});

/* =========================================================
   CUSTOM CURSOR + CARD TILT (desktop only)
   ========================================================= */
if (finePointer && !reduceMotion) {
  document.body.classList.add('has-cursor');
  const dot = $('#cursorDot'), ring = $('#cursorRing');
  let rx = mx, ry = my;
  window.addEventListener('pointermove', e => { dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; }, { passive: true });
  (function loop() {
    rx += (mx - rx) * .18; ry += (my - ry) * .18;
    ring.style.transform = `translate(${rx}px, ${ry}px)`;
    requestAnimationFrame(loop);
  })();
  document.addEventListener('pointerover', e => {
    document.body.classList.toggle('cursor-hover', !!e.target.closest('a, button, .tilt, label'));
  });
  document.addEventListener('pointerleave', () => document.body.classList.remove('has-cursor'));
  document.addEventListener('pointerenter', () => document.body.classList.add('has-cursor'));

  /* one shared rAF-throttled pointer pass: card tilt + magnetic primary buttons */
  let tiltEl = null, magEl = null, pe = null, pRaf = 0;
  const isReduced = () => document.documentElement.classList.contains('reduced');
  const pointerPass = () => {
    pRaf = 0;
    if (!pe || isReduced()) return;
    const tgt = pe.target && pe.target.closest ? pe.target : null;
    const el = tgt && tgt.closest('.tilt');
    if (tiltEl && tiltEl !== el) { tiltEl.style.transform = ''; }
    tiltEl = el;
    if (el) {
      if (el.style.transition === '') el.style.transition = 'transform var(--dur-2) var(--ease-out), box-shadow var(--dur-3) var(--ease-out), border-color var(--dur-2) var(--ease-out), opacity var(--dur-3) var(--ease-out)';
      const r = el.getBoundingClientRect();
      const px = (pe.clientX - r.left) / r.width - .5, py = (pe.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(900px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 5).toFixed(2)}deg) translateY(-4px)`;
    }
    /* magnetic pull on .btn-accent, max 6px */
    const mb = tgt && tgt.closest('.btn-accent');
    if (magEl && magEl !== mb) { magEl.style.removeProperty('--mx'); magEl.style.removeProperty('--my'); }
    magEl = mb;
    if (mb) {
      const r = mb.getBoundingClientRect();
      const dx = (pe.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (pe.clientY - (r.top + r.height / 2)) / (r.height / 2);
      mb.style.setProperty('--mx', (Math.max(-1, Math.min(1, dx)) * 6).toFixed(1) + 'px');
      mb.style.setProperty('--my', (Math.max(-1, Math.min(1, dy)) * 6).toFixed(1) + 'px');
    }
  };
  document.addEventListener('pointermove', e => { pe = e; if (!pRaf) pRaf = requestAnimationFrame(pointerPass); }, { passive: true });
  document.addEventListener('pointerleave', () => {
    if (tiltEl) tiltEl.style.transform = '';
    if (magEl) { magEl.style.removeProperty('--mx'); magEl.style.removeProperty('--my'); }
  });
}

/* =========================================================
   BOOT
   ========================================================= */
renderAll(false);
const loader = $('#loader');
setTimeout(() => loader.classList.add('done'), reduceMotion ? 0 : 950);
setTimeout(() => loader.remove(), reduceMotion ? 50 : 1600);
})();
