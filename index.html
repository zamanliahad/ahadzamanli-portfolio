/* =========================================================
   2. BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color .4s var(--ease), color .4s var(--ease);
}
/* paper grain */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0.09 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; line-height: 1.12; margin: 0; letter-spacing: -.015em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.container { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); position: relative; z-index: 2; }
.skip { position: fixed; top: -60px; left: 16px; z-index: 200; background: var(--btn-bg); color: var(--btn-ink); padding: 10px 16px; border-radius: 10px; transition: top .2s; }
.skip:focus { top: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

section { position: relative; padding: clamp(72px, 10vw, 128px) 0; }
.alt { background: var(--bg-alt); }
.sec-head { max-width: 860px; margin-bottom: clamp(40px, 6vw, 72px); }
.kicker {
  display: inline-flex; align-items: center; gap: 10px;
  font: 500 .78rem/1 var(--mono); text-transform: uppercase; letter-spacing: .12em;
  color: var(--accent-text); margin-bottom: 16px;
}
.kicker .num { color: var(--ink-soft); }
.kicker::after { content: ""; width: 28px; height: 1px; background: currentColor; opacity: .5; }
.sec-head h2 { font-size: clamp(2.3rem, 5.4vw, 4.4rem); line-height: 1.04; letter-spacing: -.032em; }
.sec-head p { margin-top: 20px; color: var(--ink-soft); font-size: 1.08rem; max-width: 56ch; }

/* icons */
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: 999px;
  font-weight: 600; font-size: .98rem; line-height: 1;
  transition: transform var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-accent { background: var(--btn-bg); color: var(--btn-ink); box-shadow: 0 10px 24px -12px rgba(193, 95, 60, .7); translate: var(--mx, 0px) var(--my, 0px); transition-property: transform, translate, background-color, box-shadow, border-color, color; }
html.reduced .btn-accent { translate: none; }
.btn-accent:hover { background: var(--btn-bg-hover); box-shadow: 0 16px 30px -14px rgba(193, 95, 60, .8); }
.btn-outline { border: 1px solid var(--ink); color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--bg); }
.btn .ic { width: 18px; height: 18px; transition: transform var(--dur-2) var(--ease-out); }
.btn:hover .arr { transform: translateX(3px); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text);
  font: 500 .72rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.chip.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-3) var(--ease-out), box-shadow var(--dur-3) var(--ease-out), border-color var(--dur-2) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.card:hover { box-shadow: var(--shadow); }
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
}
.tilt { transform-style: preserve-3d; }

/* reveal */
.js .reveal { opacity: 0; transform: translateY(18px); transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out); transition-delay: var(--d, 0ms); }
.js .reveal.in { opacity: 1; transform: none; }

/* =========================================================
   3. LOADER · PROGRESS · CURSOR · TOAST
   ========================================================= */
#loader {
  position: fixed; inset: 0; z-index: 300;
  display: grid; place-items: center; background: var(--bg);
  transition: opacity .5s var(--ease), visibility .5s;
}
#loader.done { opacity: 0; visibility: hidden; }
#loader .lw { display: grid; justify-items: center; gap: 18px; }
#loader .bot { width: 84px; }
#loader .b-eye { opacity: 0; animation: bootEye .5s .35s steps(3) forwards; }
#loader .b-ant { animation: bootEye .3s .15s steps(2) forwards; opacity: 0; }
#loader .lbl { font: 500 .75rem var(--mono); color: var(--ink-soft); letter-spacing: .14em; }
@keyframes bootEye { to { opacity: 1; } }

.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 120; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }

.cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 250; border-radius: 50%; opacity: 0; transition: opacity .3s; }
.cursor-dot { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--accent); }
.cursor-ring { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid var(--accent); transition: opacity .3s, width .3s var(--ease), height .3s var(--ease), margin .3s var(--ease), background-color .3s; }
.has-cursor .cursor-dot, .has-cursor .cursor-ring { opacity: 1; }
.has-cursor.cursor-hover .cursor-ring { width: 58px; height: 58px; margin: -29px 0 0 -29px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.has-cursor, .has-cursor a, .has-cursor button { cursor: none; }
.has-cursor input, .has-cursor textarea { cursor: text; }

#toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 260;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg);
  padding: 12px 20px; border-radius: 999px; font-weight: 500; font-size: .92rem;
  box-shadow: var(--shadow-lg);
  transition: opacity .3s var(--ease), transform .4s var(--ease);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
   4. NAV
   ========================================================= */
/* Floating glass pill. The full-width <header> is click-through; only the pill takes pointer events. */
.nav { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 100; pointer-events: none; }
.nav-inner {
  pointer-events: auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 58px; padding: 0 8px 0 14px;
  border-radius: 999px; border: 1px solid var(--glass-line);
  background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
  box-shadow: var(--shadow-sm);
  transition: background-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.nav.scrolled .nav-inner { background: var(--glass-strong); box-shadow: var(--shadow); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .nav-inner { background: var(--glass-strong); } }
@media (min-width: 1001px) {
  .nav { top: 14px; left: 0; right: 0; }
  .nav-inner { width: max-content; max-width: calc(100% - 48px); height: 56px; gap: 22px; padding: 0 7px 0 16px; }
  .nav-links a { padding: 8px 13px; font-size: .9rem; }
}
@media (min-width: 921px) {
  /* the one solid CTA in the pill */
  .nav-links a[href="#contact"] { margin-left: 6px; padding: 9px 18px; background: var(--btn-bg); color: var(--btn-ink); font-weight: 600; }
  .nav-links a[href="#contact"]:hover { background: var(--btn-bg-hover); color: var(--btn-ink); }
  .nav-links a[href="#contact"].active::after { display: none; }
  .nav .icon-btn, .nav .lang-btn { background: transparent; border-color: transparent; }
  .nav .icon-btn:hover, .nav .lang-btn:hover { border-color: var(--line); }
}
.brand { display: inline-flex; align-items: center; gap: 10px; font: 700 1.15rem var(--serif); letter-spacing: -.02em; }
.brand [data-bot] { width: 30px; }
.nav-links { display: flex; gap: 4px; }
.nav-links a {
  position: relative; padding: 8px 14px; border-radius: 999px;
  font-size: .93rem; font-weight: 500; color: var(--ink-soft);
  transition: color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.nav-links a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav-links a.active { color: var(--ink); }
.nav-links a.active::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.nav-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: transform var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.icon-btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent-text); }
.lang-btn { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 500 .8rem var(--mono); display: inline-flex; align-items: center; gap: 6px; transition: border-color var(--dur-2) var(--ease-out); }
.lang-btn:hover { border-color: var(--accent); }
.lang-btn .on { color: var(--accent-text); }
.lang-btn .off { color: var(--ink-soft); }
.theme-btn .moon { display: block; } .theme-btn .sun { display: none; }
[data-theme="dark"] .theme-btn .moon { display: none; } [data-theme="dark"] .theme-btn .sun { display: block; }
.menu-btn { display: none; }

@media (max-width: 920px) {
  .menu-btn { display: grid; }
  .nav-links {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    flex-direction: column; gap: 2px; padding: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow-lg);
    opacity: 0; transform: translateY(-8px) scale(.98); pointer-events: none; visibility: hidden;
    transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out), visibility var(--dur-2);
  }
  .nav.menu-open .nav-links { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
  .nav-links a { padding: 12px 14px; font-size: 1rem; }
  .nav-links a.active::after { left: auto; right: 16px; top: 50%; bottom: auto; margin: -2.5px 0 0; }
}

/* =========================================================
   5. MASCOT "ECHO"
   ========================================================= */
[data-bot] { display: inline-block; line-height: 0; transform-origin: 50% 85%; }
.bot { width: 100%; height: auto; overflow: visible; display: block; animation: bob 3.2s ease-in-out infinite; }
.b-body { fill: var(--echo-body, var(--bot-body)); transition: fill .4s; }
.b-visor { fill: var(--echo-visor, var(--bot-visor)); transition: fill .4s; }
.b-eye, .b-ant { fill: var(--echo-eye, var(--accent)); }
.b-gear { fill: var(--echo-gear, var(--sage, var(--accent))); }
.b-tread { fill: var(--echo-tread, var(--bg)); transition: fill .4s; }
.b-happy { opacity: 0; transition: opacity .1s; }
.bot[data-x="happy"] .b-happy { opacity: 1; }
.bot[data-x="happy"] .b-blink { opacity: 0; }
.b-ant { animation: pulse 1.8s ease-in-out infinite; }
.b-blink { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
.b-arm-up { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
.b-arm-r, .b-arm-up { transition: opacity .15s; }
.b-treads { transform-box: view-box; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3%); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } 97% { transform: scaleY(1); } }
@keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.008, 1.018); } }
@keyframes treads { 0%, 49% { transform: translateX(0); } 50%, 100% { transform: translateX(-1px); } }
@keyframes dance {
  0% { transform: rotate(-9deg) translateY(0); }
  50% { transform: rotate(0) translateY(-8%); }
  100% { transform: rotate(9deg) translateY(0); }
}

.wave .b-arm-r, .bot-hero:focus-visible .b-arm-r, .dance .b-arm-r, .bot[data-x="happy"] .b-arm-r { opacity: 0; }
.wave .b-arm-up, .bot-hero:focus-visible .b-arm-up, .dance .b-arm-up, .bot[data-x="happy"] .b-arm-up { opacity: 1; animation: wave .45s ease-in-out infinite alternate; }
@media (hover: hover) {
  .bot-hero:hover .b-arm-r { opacity: 0; }
  .bot-hero:hover .b-arm-up { opacity: 1; animation: wave .45s ease-in-out infinite alternate; }
}
.dance .b-treads { animation: treads .12s linear infinite; }
[data-bot]:not([data-bot="hero"]).dance { animation: dance .5s ease-in-out infinite alternate; }
html.reduced .bot[data-x="happy"] .b-arm-up, html.reduced .dance .b-arm-up { animation: none; }

/* =========================================================
   6. HERO
   ========================================================= */
/* #home (.hero-pin) = scroll wrapper · .hero = sticky frame · .hero-card = the scene (see 16c for the scrub) */
.hero-pin { padding: 0; }
.hero { position: relative; }
.hero-card { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 120px 0 88px; overflow: hidden; background: var(--bg); }
.hero-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.hero-bg svg { position: absolute; color: var(--line); }
.float-a { animation: float 9s ease-in-out infinite; }
.float-b { animation: float 12s ease-in-out infinite reverse; }
.spin-slow { animation: spin 50s linear infinite; transform-origin: center; transform-box: fill-box; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes spin { to { transform: rotate(360deg); } }

.hero-grid { display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: clamp(24px, 4vw, 64px); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 .85rem var(--mono); color: var(--ink-soft); margin-bottom: 20px; padding: 7px 14px 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 0 var(--sage); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sage) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 9px transparent; } }
.hero-title { font-size: clamp(3rem, 9vw, 6.2rem); font-weight: 600; letter-spacing: -.035em; line-height: .98; }
.hero-title .dot { color: var(--accent); }
.typer { margin-top: 22px; min-height: 1.7em; font: 500 clamp(1rem, 2.1vw, 1.25rem) var(--mono); color: var(--ink); }
.typer .pr { color: var(--accent-text); margin-right: 8px; }
.caret { display: inline-block; width: .55em; height: 1.1em; margin-left: 2px; vertical-align: -.18em; background: var(--accent); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.hero-lead { margin-top: 18px; max-width: 52ch; font-size: clamp(1.02rem, 1.6vw, 1.15rem); color: var(--ink-soft); }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.hero-ctas .btn { min-height: 44px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 34px; color: var(--ink-soft); font-size: .9rem; }
.hero-meta li { display: inline-flex; align-items: center; gap: 8px; }
.hero-meta .ic { width: 16px; height: 16px; color: var(--accent-text); }

.hero-art { display: grid; place-items: center; }
.bot-stage { position: relative; display: grid; justify-items: center; padding-top: 70px; }
.bot-hero { position: relative; width: clamp(200px, 26vw, 340px); border-radius: 24px; }
.bot-hero { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.bot-hero [data-bot] { width: 100%; transform-origin: 50% 75%; will-change: transform; }
.bot-hero .bot { filter: drop-shadow(0 18px 22px rgba(20, 20, 19, .12)); animation: breathe 4.2s ease-in-out infinite; transform-origin: 50% 100%; }
.bot-hero .bot.is-sleep { animation-duration: 8s; }
.bot-hero .b-blink { animation: none; }
.bot-shadow { width: 55%; height: 14px; margin-top: 6px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--ink) 18%, transparent), transparent); will-change: transform, opacity; }
.echo-fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.echo-fx .fx { position: absolute; font: 700 16px/1 var(--mono); font-style: normal; color: var(--accent); opacity: 0; will-change: transform, opacity; }
.echo-fx .fx.z { color: var(--ink-soft); }
.hero-hint { margin-top: 10px; font: 400 .75rem var(--mono); color: var(--ink-soft); opacity: .8; }

@media (max-width: 700px) { .hero-hint { display: none; } }

/* touch (incl. tablets): 44px targets */
@media (pointer: coarse) {
  .icon-btn, .lang-btn { min-width: 44px; min-height: 44px; }
  .brand { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; }
  .btn-sm, .filter, .social, .copy-btn { min-height: 44px; }
  .copy-btn, .social { min-width: 44px; }
  .icon-btn.cmd-btn { min-width: 44px; }
  .c-meta a { display: inline-flex; align-items: center; min-height: 44px; }
  .foot a, .foot-l a { display: inline-flex; align-items: center; min-height: 44px; }
}

/* ---- Command palette ---- */
.cmd-btn { width: auto; min-width: 40px; }
.cmd-kbd { display: none; }
@media (hover: hover) and (pointer: fine) and (min-width: 921px) {
  .cmd-btn { display: inline-flex; align-items: center; gap: 8px; padding: 0 13px 0 11px; border-radius: 999px; }
  .cmd-kbd { display: inline; font: 500 .72rem var(--mono); color: var(--ink-soft); }
}
dialog.cmd { width: min(600px, calc(100vw - 24px)); max-height: min(72svh, 540px); margin: 12vh auto auto; padding: 0; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); overflow: hidden; }
dialog.cmd[open] { display: flex; animation: modalIn .4s var(--ease); }
dialog.cmd::backdrop { background: rgba(20, 20, 19, .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.has-cursor dialog.cmd, .has-cursor dialog.cmd * { cursor: auto; }
.cmd-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cmd-top > .ic { color: var(--accent-text); }
.cmd-top input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 1rem var(--sans); padding: 6px 0; }
.cmd-top input::placeholder { color: var(--ink-soft); }
.cmd-x { display: none; width: 34px; height: 34px; }
.cmd-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
.cmd-list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: .95rem; cursor: pointer; }
.cmd-list li[aria-selected="true"] { background: var(--accent-soft); }
.cmd-list .ic { color: var(--accent-text); }
.cmd-lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-g { margin-left: auto; padding-left: 8px; font: 500 .68rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.cmd-empty { padding: 22px 16px; text-align: center; color: var(--ink-soft); font-size: .92rem; }
.cmd-empty[hidden] { display: none; }
.cmd-foot { padding: 9px 16px; border-top: 1px solid var(--line); font: 400 .72rem var(--mono); color: var(--ink-soft); }
@media (max-width: 600px), (hover: none) {
  .cmd-x { display: grid; }
  .cmd-foot { display: none; }
}
@media (max-width: 600px) {
  dialog.cmd { width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)); margin-top: max(8px, env(safe-area-inset-top)); max-height: min(60svh, 480px); border-radius: var(--r); }
  .cmd-top { padding: 8px 8px 8px 16px; }
  .cmd-top input { font-size: 16px; min-height: 44px; }
  .cmd-x { width: 44px; height: 44px; }
  .cmd-list li { min-height: 44px; }
  .cmd-list { padding-bottom: max(6px, env(safe-area-inset-bottom)); }
}

@media (max-width: 860px) {
  .hero-card { padding-top: 104px; }
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { order: -1; }
  .bot-stage { padding-top: 56px; }
  .bot-hero { width: 170px; }
}
/* Phones: text first (name + CTA above the fold), smaller Echo after it */
@media (max-width: 700px) {
  .hero-art { order: 0; margin-top: 8px; }
  .bot-stage { padding-top: 48px; }
  .bot-hero { width: 104px; }
}

/* =========================================================
   7. ABOUT
   ========================================================= */
.about-grid { display: grid; grid-template-columns: 1.1fr .9fr; grid-template-areas: "head stats" "text stats"; grid-template-rows: auto 1fr; column-gap: clamp(32px, 6vw, 80px); row-gap: 0; align-items: start; }
.about-head { grid-area: head; margin-bottom: 28px; }
.about-head h2 { font-size: clamp(2.3rem, 4.4vw, 3.6rem); }
.about-text { grid-area: text; }
.stats { grid-area: stats; }
.portrait { grid-area: photo; margin: 0; width: 100%; max-width: 360px; justify-self: end; }
.portrait[hidden] { display: none; }
.about-grid.has-photo { grid-template-areas: "head photo" "text photo" "text stats"; grid-template-rows: auto auto 1fr; }
.about-grid.has-photo .stats { margin-top: 14px; }
.portrait-img { aspect-ratio: 4 / 5; border-radius: var(--r-lg); overflow: hidden; background: var(--bg-alt); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; }
.portrait-img::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent); pointer-events: none; }
.portrait-img img { width: 100%; height: 100%; object-fit: cover; object-position: 35% 30%; display: block; }
.portrait figcaption { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; padding-left: 14px; border-left: 3px solid var(--accent); font-size: .85rem; color: var(--ink-soft); }
.portrait figcaption b { font: 600 1rem var(--serif); color: var(--ink); }
.c-who { display: flex; align-items: center; gap: 14px; margin: 18px 0 18px; }
.c-who[hidden] { display: none; }
.avatar { width: 64px; height: 64px; flex: none; border-radius: 50%; overflow: hidden; background: var(--bg-alt); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 35% 30%; transform: scale(1.45); transform-origin: 35% 42%; display: block; }
.c-who-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.c-who-t b { font-weight: 600; }
.c-who-t small { font: 400 .72rem var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.about-text p { font-size: 1.12rem; color: var(--ink-soft); }
.about-text p + p { margin-top: 18px; }
.about-text strong { color: var(--ink); font-weight: 600; }
.lead-quote { font: 400 italic clamp(1.4rem, 2.6vw, 1.85rem)/1.35 var(--serif); color: var(--ink); margin-bottom: 26px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.stat { padding: 22px; }
.stat:nth-child(5) { grid-column: 1 / -1; }
.stat-v { font: 600 clamp(1.5rem, 2.6vw, 2rem)/1.1 var(--serif); letter-spacing: -.02em; }
.stat-v em { font-style: normal; color: var(--accent-text); }
.stat-l { margin-top: 6px; font-size: .88rem; color: var(--ink-soft); }
@media (max-width: 860px) {
  .about-grid, .about-grid.has-photo { grid-template-columns: 1fr; grid-template-areas: "head" "text" "stats"; grid-template-rows: none; }
  .about-grid.has-photo { grid-template-areas: "head" "photo" "text" "stats"; }
  .about-grid.has-photo .stats { margin-top: 28px; }
  .about-grid:not(.has-photo) .stats { margin-top: 28px; }
  .about-head { margin-bottom: 22px; }
  .portrait { max-width: none; justify-self: stretch; margin-bottom: 26px; display: grid; grid-template-columns: min(46%, 180px) 1fr; gap: 16px; align-items: end; }
  .portrait[hidden] { display: none; }
  .portrait figcaption { margin-top: 0; padding-bottom: 4px; }
}

/* =========================================================
   8. SKILLS
   ========================================================= */
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.skill { padding: 26px; }
.skill-h { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.ic-box { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.skill-h h3 { font-size: 1.22rem; }
.skill-item + .skill-item { margin-top: 16px; }
.skill-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: .95rem; font-weight: 500; }
.skill-row .lvl { font: 500 .72rem var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.meter i { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter i.on::after { content: ""; position: absolute; inset: 0; background: var(--accent); border-radius: inherit; transform: scaleX(0); transform-origin: 0 50%; transition: transform .6s var(--ease); transition-delay: calc(var(--d, 0ms) + var(--s) * 110ms + 200ms); }
.reveal.in .meter i.on::after, html:not(.js) .meter i.on::after { transform: scaleX(1); }
.meter.learning i.on::after { background: var(--sage); }
.skill-note { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 16px; font-size: .84rem; color: var(--ink-soft); }
.skill-note span { display: inline-flex; align-items: center; gap: 8px; }
.skill-note b { width: 18px; height: 6px; border-radius: 3px; background: var(--accent); display: inline-block; }
.skill-note b.sg { background: var(--sage); }
@media (max-width: 980px) { .skills-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .skills-grid { grid-template-columns: 1fr; } }

/* =========================================================
   9. BASKO
   ========================================================= */
.basko { background: var(--basko-bg); color: var(--basko-ink); overflow: hidden; }
.basko::before { content: ""; position: absolute; width: 720px; height: 720px; right: -220px; top: -260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(217, 119, 87, .28), transparent); pointer-events: none; }
.basko .kicker { color: var(--accent); }
.basko .kicker .num { color: var(--basko-soft); }
.basko-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
.wordmark { font: 800 clamp(4rem, 13vw, 9rem)/.85 var(--sans); letter-spacing: -.06em; margin: 4px 0 18px; }
.wordmark span { color: var(--accent); }
.role { display: inline-flex; gap: 8px; align-items: center; font: 500 .8rem var(--mono); color: var(--basko-soft); border: 1px solid var(--basko-line); padding: 6px 12px; border-radius: 999px; }
.role b { color: var(--basko-ink); font-weight: 500; }
.basko-story { margin-top: 22px; color: var(--basko-soft); font-size: 1.06rem; max-width: 54ch; }
.feat { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.feat .chip { background: rgba(217, 119, 87, .14); color: #F0A487; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 28px; }
.cat { display: grid; justify-items: center; gap: 8px; padding: 16px 8px; border: 1px solid var(--basko-line); border-radius: 14px; font-size: .8rem; color: var(--basko-soft); transition: border-color .3s, transform .4s var(--ease), color .3s; }
.cat:hover { border-color: var(--accent); color: var(--basko-ink); transform: translateY(-3px); }
.cat .ic { width: 26px; height: 26px; color: var(--basko-ink); stroke-width: 1.5; }
.basko-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 22px 28px; margin-top: 32px; }
.big-stat { font: 600 2.6rem/1 var(--serif); }
.big-stat small { display: block; font: 400 .82rem var(--sans); color: var(--basko-soft); margin-top: 6px; }
.basko .btn-accent { background: var(--accent); color: #141413; box-shadow: 0 12px 28px -12px rgba(217, 119, 87, .8); }
.basko .btn-accent:hover { background: #E5906F; }

.browser { background: #1C1B1A; border: 1px solid var(--basko-line); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 30px 60px -28px rgba(0, 0, 0, .7); }
[data-theme="dark"] .browser { background: #1F1E1D; }
.browser-bar { display: flex; align-items: center; gap: 7px; padding: 12px 14px; border-bottom: 1px solid var(--basko-line); }
.browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: #3A3833; }
.browser-bar i:first-child { background: var(--accent); }
.browser-url { margin-left: 10px; flex: 1; font: 400 .74rem var(--mono); color: var(--basko-soft); background: rgba(255, 255, 255, .05); padding: 6px 10px; border-radius: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browser-body { aspect-ratio: 4 / 3; display: grid; place-items: center; position: relative; }
.browser-body img { width: 100%; height: 100%; object-fit: cover; }
.shot-ph { text-align: center; padding: 24px; color: var(--basko-soft); }
.shot-ph .wm { font: 800 3.4rem/1 var(--sans); letter-spacing: -.06em; color: var(--basko-ink); opacity: .9; }
.shot-ph .wm span { color: var(--accent); }
.shot-ph p { margin-top: 10px; font: 400 .78rem var(--mono); }
.shot-ph .grid-dec { position: absolute; inset: 0; background-image: linear-gradient(var(--basko-line) 1px, transparent 1px), linear-gradient(90deg, var(--basko-line) 1px, transparent 1px); background-size: 32px 32px; mask-image: radial-gradient(closest-side, #000, transparent); -webkit-mask-image: radial-gradient(closest-side, #000, transparent); opacity: .6; }
.shot-ph > * { position: relative; }

.marquee { margin-top: clamp(56px, 8vw, 88px); border-top: 1px solid var(--basko-line); border-bottom: 1px solid var(--basko-line); overflow: hidden; position: relative; z-index: 2; }
.marquee-track { display: flex; width: max-content; animation: marq 32s linear infinite; }
.marquee span { padding: 18px 0; font: 700 clamp(1.1rem, 2.4vw, 1.6rem) var(--sans); letter-spacing: -.02em; white-space: nowrap; color: var(--basko-soft); }
.marquee span b { color: var(--accent); margin: 0 22px; font-weight: 700; }
@keyframes marq { to { transform: translateX(-50%); } }
@media (max-width: 860px) { .basko-grid { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .cats { grid-template-columns: repeat(2, 1fr); } }

/* =========================================================
   10. PROJECTS
   ========================================================= */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.filter {
  padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font: 500 .82rem var(--mono); color: var(--ink-soft);
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
.filter:hover { border-color: var(--ink-soft); color: var(--ink); transform: translateY(-1px); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.proj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.proj { padding: 28px; display: flex; flex-direction: column; min-height: 270px; }
.proj.is-hidden { display: none; }
.proj.pop { animation: pop .5s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.proj.soon { border-style: dashed; background: transparent; box-shadow: none; }
/* category accent strip + hover (tilt owns transform, so hover uses border/shadow/icon) */
.proj { position: relative; overflow: hidden; --pc: var(--accent); }
.proj[data-cat="business"] { --pc: var(--accent); }
.proj[data-cat="web"] { --pc: var(--sage); }
.proj[data-cat="robotics"] { --pc: var(--accent-text); }
.proj[data-cat="python"] { --pc: var(--ink-soft); }
.proj::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; pointer-events: none;
  background: var(--pc); opacity: 0; transform: scaleX(.2); transform-origin: 0 50%;
  transition: transform var(--dur-3) var(--ease-out), opacity var(--dur-2) var(--ease-out); }
.proj .ic-box { position: relative; background: color-mix(in srgb, var(--pc) 16%, transparent); color: var(--pc); transition: transform var(--dur-3) var(--ease-out); }
.proj:hover { border-color: color-mix(in srgb, var(--pc) 55%, var(--line)); }
.proj:hover::before { opacity: 1; transform: none; }
.proj:hover .ic-box { transform: translateY(-3px) rotate(-4deg); }
.proj-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.badge { font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
.badge.live { border-color: transparent; background: color-mix(in srgb, var(--sage) 18%, transparent); color: color-mix(in srgb, var(--sage) 55%, var(--ink)); display: inline-flex; align-items: center; gap: 6px; }
.badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.proj h3 { font-size: 1.45rem; }
.proj p { margin-top: 10px; color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.tag { font: 400 .74rem var(--mono); color: var(--ink-soft); padding: 4px 9px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.proj-actions { margin-top: auto; padding-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; font-weight: 500; transition: border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); }
.btn-sm .ic { width: 16px; height: 16px; }
a.btn-sm:hover { border-color: var(--accent); color: var(--accent-text); transform: translateY(-2px); }
.btn-sm.disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 720px) { .proj-grid { grid-template-columns: 1fr; } }

/* =========================================================
   11. NOW LEARNING
   ========================================================= */
.learn { padding: clamp(48px, 7vw, 80px) 0; }
.learn-box { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; padding: 26px clamp(20px, 3vw, 34px); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.learn-box h3 { font-size: 1.4rem; display: flex; align-items: center; gap: 12px; }

@keyframes ping2 { 0% { box-shadow: 0 0 0 0 rgba(217, 119, 87, .55); } 80%, 100% { box-shadow: 0 0 0 8px transparent; } }

/* =========================================================

   ========================================================= */
.edu-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: clamp(32px, 5vw, 64px); align-items: start; }

.lang-item { padding: 22px 24px; }
.lang-item + .lang-item { margin-top: 14px; }
.lang-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lang-top b { font: 600 1.15rem var(--serif); }
.lang-top span { font: 500 .78rem var(--mono); color: var(--accent-text); }
.cefr { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 14px; }
.cefr i { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.cefr i.on::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; transition: transform .5s var(--ease); transition-delay: calc(var(--s) * 90ms + 250ms); }
.reveal.in .cefr i.on::after { transform: scaleX(1); }
.cefr-l { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; font: 400 .66rem var(--mono); color: var(--ink-soft); text-align: center; }

/* =========================================================
   13. CERTIFICATES
   ========================================================= */
/* Horizontal gallery (data-scene="hscroll"). Desktop: pinned track moved by --hx. Elsewhere: native snap row.
   Selectors carry an extra class so they win over the engine baseline in 16b. */
.cert-scene {
  --h-gap: clamp(14px, 2vw, 28px);
  --card-w: min(80vw, 400px);
  --gutter: max(clamp(16px, 4vw, 32px), calc((100% - 1160px) / 2 + clamp(16px, 4vw, 32px)));
  position: relative; z-index: 2;
}
@media (min-width: 701px) { .cert-scene { --card-w: min(58vw, 440px); } }
@media (min-width: 1001px) { .cert-scene { --card-w: clamp(340px, min(42vw, (100vh - 290px) * 1.2), 600px); } }
.cert-scene > .cert-grid.h-track {
  align-items: stretch;
  padding: 10px 0 34px var(--gutter);
  scroll-padding-left: var(--gutter);
  scrollbar-width: none;
}
/* trailing spacer: a flex item, so it counts in scrollWidth even when the pinned track is overflow:visible
   (end padding does not). Sized so the last card ends centred in the viewport.
   Here 100% = track width - gutter, so the gutter is re-derived from it: G = max(c, 100% + 2c - 1160px). */
.cert-scene > .cert-grid.h-track::after { content: ""; flex: 0 0 auto; align-self: stretch; min-height: 1px;
  width: max(0px, calc((100% + max(clamp(16px, 4vw, 32px), 100% + 2 * clamp(16px, 4vw, 32px) - 1160px) - var(--card-w)) / 2 - var(--h-gap))); }
.cert-scene > .cert-grid.h-track::-webkit-scrollbar { display: none; }
.cert-scene.is-pinned > .cert-grid.h-track { padding-top: 64px; padding-bottom: 0; align-items: center; }
.cert { width: var(--card-w); padding: 0; overflow: hidden; text-align: left; display: flex; flex-direction: column;
  transition: transform .6s var(--ease), opacity .6s var(--ease), box-shadow .45s var(--ease), border-color .3s, background-color .4s; }
.cert:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: var(--shadow); }
.cert-type { font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.cert h3 { font-size: clamp(1.25rem, 2vw, 1.6rem); margin-top: 8px; line-height: 1.18; letter-spacing: -.02em; }
.cert p { margin-top: 6px; font-size: .9rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cert-more { margin-top: auto; padding-top: 16px; font-size: .85rem; font-weight: 600; color: var(--accent-text); display: inline-flex; align-items: center; gap: 6px; }
.cert-more .ic { width: 16px; height: 16px; transition: transform .3s var(--ease); }
.cert:hover .cert-more .ic { transform: translateX(3px); }
.cert-thumb { position: relative; display: block; aspect-ratio: 4 / 3; background: var(--bg-alt); border-bottom: 1px solid var(--line); overflow: hidden; }
.cert-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transition: transform .9s var(--ease); }
.cert:hover .cert-thumb img { transform: scale(1.04); }
.cert-thumb.ph { display: grid; place-items: center; color: var(--accent-text); background: radial-gradient(circle at 50% 45%, var(--accent-soft), var(--bg-alt) 70%); }
.cert-thumb.ph::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1.4px); background-size: 18px 18px; -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); }
.cert-thumb.ph.sg { color: var(--sage); background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--sage) 22%, var(--bg-alt)), var(--bg-alt) 70%); }
.cert-thumb.ph .ic { position: relative; width: 30%; height: auto; aspect-ratio: 1; stroke-width: 1.2; }
.cert-count { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: rgba(20, 20, 19, .72); color: #F5F4EE; font: 500 .7rem var(--mono); }
.cert-count .ic { width: 13px; height: 13px; }
.cert-info { padding: 20px 24px 22px; display: flex; flex-direction: column; flex: 1; min-width: 0; }
/* the card in the focus band is "current"; neighbours sit back slightly (IO adds .has-focus / .is-center) */
.cert-scene.has-focus .cert:not(.is-center) { transform: scale(.94); opacity: .72; }
.cert-scene.has-focus .cert:not(.is-center) .cert-thumb img { transform: scale(1.08); }
.cert-scene.has-focus .cert:focus-visible { opacity: 1; }

dialog.modal { width: min(560px, calc(100vw - 24px)); max-height: calc(100svh - 24px); padding: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); overflow: auto; overscroll-behavior: contain; }
dialog.modal::backdrop { background: rgba(20, 20, 19, .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
dialog.modal[open] { animation: modalIn .4s var(--ease); }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.modal-media { position: relative; min-height: 220px; background: var(--bg-alt); display: grid; place-items: center; border-bottom: 1px solid var(--line); }
.modal-media img { width: 100%; height: auto; max-height: min(64svh, 640px); object-fit: contain; }
.m-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(20, 20, 19, .62); color: #F5F4EE; transition: background-color .25s; }
.m-nav:hover { background: rgba(20, 20, 19, .85); }
.m-prev { left: 10px; } .m-next { right: 10px; }

.modal-ph { text-align: center; color: var(--ink-soft); font: 400 .82rem var(--mono); display: grid; justify-items: center; gap: 12px; padding: 24px; }

.modal-close { position: absolute; top: 12px; right: 12px; z-index: 2; }

/* =========================================================
   11b. EXPERIENCE
   ========================================================= */
.exp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.exp { position: relative; display: flex; flex-direction: column; gap: 16px; padding: clamp(22px, 3vw, 30px); overflow: hidden; }
.exp::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); transform: scaleY(0); transform-origin: 50% 0; transition: transform .6s var(--ease-out); }

.exp-logo img { width: 100%; height: 100%; object-fit: contain; }

.exp-chip.now::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 0 0 rgba(63,185,80,.5); animation: expPulse 2s infinite; }
@keyframes expPulse { 70% { box-shadow: 0 0 0 7px rgba(63,185,80,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }
.exp p { color: var(--ink-soft); font-size: .95rem; }

.exp-roles li { position: relative; }

.social:hover { color: var(--accent-text); border-color: var(--accent); transform: translateY(-3px); }
.social.ph { border-style: dashed; color: var(--ink-soft); }

.form { padding: clamp(22px, 3vw, 34px); }

/* =========================================================
   16b. SCROLL SCENES (engine baseline; see JS "SCROLL SCENE ENGINE") + SECTION RAIL
   ========================================================= */
[data-scene] { --p: 0; }
html.reduced [data-scene] { --p: 1; }
[data-scene="hscroll"] { position: relative; }
[data-scene="hscroll"] > .h-track { display: flex; gap: var(--h-gap, 20px); overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
[data-scene="hscroll"] > .h-track > * { flex: 0 0 auto; scroll-snap-align: start; }
[data-scene="hscroll"].is-pinned { overflow: clip; }
[data-scene="hscroll"].is-pinned > .h-track { position: sticky; top: 0; height: 100vh; height: 100svh; align-items: center; overflow: visible; scroll-snap-type: none; transform: translate3d(var(--hx, 0px), 0, 0); will-change: transform; }

.rail { display: none; }
@media (min-width: 1001px) and (hover: hover) and (pointer: fine) {
  .rail { display: block; position: fixed; right: clamp(6px, 1vw, 20px); top: 50%; transform: translateY(-50%); z-index: 80; }
}
.rail ol { list-style: none; margin: 0; padding: 8px 4px; display: grid; gap: 2px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 55%, transparent); border: 1px solid var(--glass-line); box-shadow: var(--shadow-sm); }
.rail-dot { position: relative; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--ink-soft); cursor: pointer; }
/* one 4x18 bar per dot: squashed to a dot by default, full height (accent) when current */
.rail-dot::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: currentColor; opacity: .38; transform: scaleY(.3); transition: transform .5s var(--ease), opacity .3s, background-color .3s; }
.rail-dot:hover::before, .rail-dot:focus-visible::before { opacity: .9; transform: scaleY(.55); }
.rail-dot.is-current { color: var(--accent); }
.rail-dot.is-current::before { opacity: 1; transform: scaleY(1); }
.rail-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rail-label { position: absolute; right: calc(100% + 12px); top: 50%; transform: translate(10px, -50%); white-space: nowrap; font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 999px; padding: 7px 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s, transform .4s var(--ease); }
.rail-dot.is-current .rail-label { color: var(--accent-text); }
.rail-dot:hover .rail-label, .rail-dot:focus-visible .rail-label { opacity: 1; transform: translate(0, -50%); }

/* =========================================================
   16c. CINEMATIC SCROLL: hero pin, section entrances, media unmask
   Everything moving is driven by the engine's --p (0..1) and only
   touches transform / opacity / clip-path. Scoped to .js +
   no-preference, so no-JS and reduced motion get the static page.
   ========================================================= */
/* static pieces (visible in every mode) */
.hero-dots { position: absolute; inset: -12% -4%; z-index: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 18%, transparent) 1px, transparent 1.6px); background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(ellipse 65% 55% at 68% 48%, #000 15%, transparent 72%); mask-image: radial-gradient(ellipse 65% 55% at 68% 48%, #000 15%, transparent 72%); }
.bot-glow { position: absolute; inset: 16% -32% -14%; border-radius: 50%; pointer-events: none; opacity: .3;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 34%, transparent), transparent 72%); }
.hero-scroll { position: absolute; left: 50%; bottom: 20px; z-index: 3; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  font: 500 .68rem/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.hero-scroll i { display: block; width: 1px; height: 32px; background: linear-gradient(var(--ink-soft), transparent); transform-origin: 50% 0; animation: scrollCue 2.2s var(--ease) infinite; }
@keyframes scrollCue { 0% { transform: scaleY(0); opacity: 1; } 55% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
@media (max-width: 700px) { .hero-scroll { bottom: 14px; gap: 6px; } .hero-scroll i { height: 20px; } }
/* card clearly taller than the viewport (short phones, JS adds .is-tall): the hint would land on Echo, and the cut-off card already shows there is more */
.hero-pin.is-tall .hero-scroll { display: none; }
.hero-outro, .hero-dim { display: none; }
/* split words (data-split): each word rises out of its own mask; --e = 1 means settled */
.w { display: inline-block; vertical-align: top; overflow: hidden; padding: .1em .03em .16em; margin: -.1em -.03em -.16em; }
.w > span { display: inline-block; }

@media (prefers-reduced-motion: no-preference) {
  /* ---------- HERO PIN ---------- */
  .js .hero-pin {
    --pin-extra: 140vh; --t-end: .4; --h0: .7; --o0: .3; --o-len: .22;
    /* --q: pin progress measured from the moment .hero is actually stuck. On short screens .hero sticks
       at a negative top, so the first --p0 of --p is plain page scroll; nothing scrubs during it. */
    --q: clamp(0, (var(--p) - var(--p0, 0)) / (1 - var(--p0, 0)), 1);
    --t: clamp(0, var(--q) / var(--t-end), 1);                     /* intro text out + Echo forward */
    --o: clamp(0, (var(--q) - var(--o0)) / var(--o-len), 1);       /* outro headline in */
    --h: clamp(0, (var(--q) - var(--h0)) / (1 - var(--h0)), 1);    /* hand-off into About */
    height: calc(var(--hero-h, 100vh) + var(--pin-extra));
  }
  .js .hero { position: sticky; top: var(--hero-top, 0px); background: var(--bg-alt); }
  .js .hero-card { will-change: transform;
    clip-path: inset(calc(var(--h) * 3.5vh) calc(var(--h) * 3.5vw) round calc(var(--h) * 32px));
    transform: translate3d(0, calc(var(--h) * -3vh), 0) scale(calc(1 - var(--h) * .04)); }
  .js .hero-text { transform-origin: 0 0; will-change: transform, opacity;
    transform: translate3d(0, calc(var(--t) * -9vh), 0) scale(calc(1 - var(--t) * .06));
    opacity: calc(1 - var(--t) * 1.15); }
  .js .hero-bg { transform: translate3d(0, calc(var(--q) * -26vh), 0); }   /* near layer: fast */
  .js .hero-dots { transform: translate3d(0, calc(var(--q) * -7vh), 0) scale(calc(1 + var(--q) * .14));   /* far layer: slow */
    opacity: calc(.5 + var(--t) * .4); }
  .js .bot-stage { --echo-dx: -20vw; --echo-dy: -3vh; --echo-s: .3; will-change: transform;
    transform: translate3d(calc(var(--t) * var(--echo-dx)), calc(var(--t) * var(--echo-dy)), 0); }
  .js .bot-hero { transform-origin: 50% 100%; transform: scale(calc(1 + var(--t) * var(--echo-s))); }
  .js .bot-glow { opacity: calc(.3 + var(--t) * .7); transform: scale(calc(.85 + var(--t) * .45)); }
  /* hint sits at the viewport bottom on first paint even when the card is taller than the screen */
  .js .hero-scroll { bottom: calc(20px - var(--hero-top, 0px)); opacity: clamp(0, 1 - var(--p) * 9, 1); }
  .js .hero-dim { display: block; position: absolute; inset: 0; z-index: 4; pointer-events: none; background: var(--dim); opacity: var(--h); }
  /* About slides up over the pinned hero during the hand-off */
  .js .hero-pin + #about { margin-top: -40vh; background: var(--bg); border-radius: clamp(24px, 3vw, 40px) clamp(24px, 3vw, 40px) 0 0; box-shadow: var(--shadow-up); }

  /* ---------- SECTION ENTRANCES ---------- */
  .js .sec-scene { --k: clamp(0, var(--p) * 4.4, 1); --k2: clamp(0, (var(--p) - .1) * 6, 1); }
  .js .sec-scene .w { --e: clamp(0, (var(--p) - .02 - var(--i) * .018) * 5.5, 1); }
  .js .w > span { transform: translate3d(0, calc((1 - var(--e, 1)) * 112%), 0); opacity: calc(.15 + var(--e, 1) * .85); }
  .js .sec-scene .kicker { opacity: var(--k); transform: translate3d(calc((1 - var(--k)) * var(--kx, -24px)), 0, 0); }
  .js .sec-scene > p { opacity: var(--k2); transform: translate3d(0, calc((1 - var(--k2)) * 18px), 0); }
  /* media: clip-path unmask from a smaller rounded rect + 1.08 -> 1 settle */
  .js .media-scene { --m: clamp(0, var(--p) * 3.4, 1); }
  .js .portrait-img img, .js .browser-body {
    clip-path: inset(calc((1 - var(--m)) * 14%) calc((1 - var(--m)) * 10%) round calc((1 - var(--m)) * 40px)); }
  .js .portrait-img img { transform: scale(calc(1.08 - var(--m) * .08)); }
  .js .browser-body > * { transform: scale(calc(1.08 - var(--m) * .08)); }
}
/* outro headline: bottom-left on desktop (Velar-style); top-left on phones/tablets, above Echo */
@media (prefers-reduced-motion: no-preference) {
  .js .hero-outro { display: block; position: absolute; z-index: 5; pointer-events: none;
    top: calc(104px - var(--hero-top, 0px)); left: clamp(16px, 4vw, 32px); right: clamp(16px, 4vw, 32px);
    opacity: calc(var(--o) * (1 - var(--h) * .55)); transform: translate3d(0, calc((1 - var(--o)) * 4vh), 0); }
  .js .hero-outro .kicker { margin-bottom: 10px; }
  .js .hero-outro-t { font: 600 clamp(2.4rem, 10vw, 5.6rem)/1 var(--serif); letter-spacing: -.035em; color: var(--ink); }
  .js .hero-outro .w { --e: clamp(0, var(--o) * 1.8 - var(--i) * .3, 1); }
}
@media (prefers-reduced-motion: no-preference) and (min-width: 1001px) {
  .js .hero-outro { top: auto; right: auto; bottom: 6vh; left: max(32px, calc((100% - 1160px) / 2 + 32px)); max-width: min(72%, 980px); }
  .js .hero-outro-t { font-size: clamp(2.8rem, 6vw, 5.6rem); }
}
/* phones + tablets: shorter pin, Echo moves vertically; still transform/opacity/clip only */
@media (prefers-reduced-motion: no-preference) and (max-width: 1000px) {
  /* text gone by q≈.31, outro in .3-.46, held to .7 (≈.24 × 100vh ≈ 150px at 640 tall) before the hand-off */
  .js .hero-pin { --pin-extra: 100vh; --t-end: .36; --h0: .7; --o0: .3; --o-len: .16; }
  .js .bot-stage { --echo-dx: 0px; --echo-dy: 10vh; --echo-s: .25; }
  .js .hero-pin + #about { margin-top: -25vh; }
}
@media (prefers-reduced-motion: no-preference) and (min-width: 861px) and (max-width: 1000px) {
  .js .bot-stage { --echo-dx: -8vw; --echo-dy: 0px; }
}
@media (prefers-reduced-motion: no-preference) and (max-width: 700px) {
  .js .bot-stage { --echo-dy: -16vh; --echo-s: .5; }
}

/* =========================================================
   17. REDUCED MOTION
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
  .js .reveal { opacity: 1; transform: none; }
  .meter i.on::after, .cefr i.on::after { transform: scaleX(1); }
  .card:hover { transform: none; }
  .btn-accent { translate: none; }
}
html.reduced *, html.reduced *::before, html.reduced *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
html.reduced .js .reveal, html.reduced.js .reveal { opacity: 1; transform: none; }
html.reduced .card:hover { transform: none; }

/* mobile: lighter glass, no blurred modal backdrops */
@media (max-width: 600px) {
  .nav-inner { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  dialog.cmd::backdrop, dialog.modal::backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(20, 20, 19, .7); }
}
</style>

/* =========================================================
   MASCOT "ECHO" — 16×16 pixel robot
   ========================================================= */
function botSVG(fixedColors) {
  const C = fixedColors;
  const R = (x, y, w, h, k) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${C ? `fill="${C[k]}"` : `class="b-${k}"`}/>`;
  return `<svg class="bot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
    ${R(7, 0, 2, 2, 'ant')}${R(7, 2, 2, 1, 'body')}
    ${R(4, 3, 8, 1, 'body')}${R(3, 4, 10, 5, 'body')}${R(4, 9, 8, 1, 'body')}
    ${R(2, 5, 1, 2, 'body')}${R(13, 5, 1, 2, 'body')}
    ${R(4, 5, 8, 3, 'visor')}
    <g class="b-eyes"><g class="b-blink">${R(5, 6, 2, 1, 'eye')}${R(9, 6, 2, 1, 'eye')}</g>${C ? '' : `<g class="b-happy">${R(5, 7, 1, 1, 'eye')}${R(6, 6, 1, 1, 'eye')}${R(7, 7, 1, 1, 'eye')}${R(9, 7, 1, 1, 'eye')}${R(10, 6, 1, 1, 'eye')}${R(11, 7, 1, 1, 'eye')}</g>`}</g>
    ${R(6, 10, 4, 1, 'body')}${R(4, 11, 8, 3, 'body')}
    ${R(7, 11, 2, 3, 'gear')}${R(6, 12, 4, 1, 'gear')}${R(7, 12, 2, 1, 'body')}
    <g class="b-arm-l">${R(2, 11, 2, 1, 'body')}${R(2, 12, 1, 2, 'body')}</g>
    <g class="b-arm-r">${R(12, 11, 2, 1, 'body')}${R(13, 12, 1, 2, 'body')}</g>
    <g class="b-arm-up">${R(12, 11, 2, 1, 'body')}${R(13, 8, 1, 3, 'body')}</g>
    ${R(3, 14, 4, 2, 'body')}${R(9, 14, 4, 2, 'body')}
    <g class="b-treads">${R(4, 15, 1, 1, 'tread')}${R(6, 15, 1, 1, 'tread')}${R(10, 15, 1, 1, 'tread')}${R(12, 15, 1, 1, 'tread')}</g>
  </svg>`;
}
$$('[data-bot]').forEach(el => { el.innerHTML = botSVG(); });

function renderStatic() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => { el.textContent = ui(el.dataset.i18n); });
  $$('[data-i18n-html]').forEach(el => { el.innerHTML = ui(el.dataset.i18nHtml); });
  $$('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', ui(el.dataset.i18nAria)); });
  $$('[data-i18n-alt]').forEach(el => { el.setAttribute('alt', ui(el.dataset.i18nAlt)); });
  $$('#langBtn [data-l]').forEach(s => { s.className = s.dataset.l === lang ? 'on' : 'off'; });
  $('#langBtn').setAttribute('aria-label', ui('langSwitch'));
  if (!finePointer) $('.hero-hint').textContent = ui('bot.hintTouch');
  const cvBtn = $('#cvBtn');
  if (CONTENT.cv) cvBtn.href = CONTENT.cv; else cvBtn.style.display = 'none';
}

  const grid = $('.about-grid'), fig = $('#portrait'), who = $('#cWho');
  const hide = () => { fig.hidden = true; who.hidden = true; grid.classList.remove('has-photo'); };
  if (!CONTENT.photo) return hide();
  $('#portraitName').textContent = CONTENT.name; $('#cWhoName').textContent = CONTENT.name;
  ['#portraitImg', '#avatarImg'].forEach(s => { const im = $(s); im.addEventListener('error', hide); im.src = CONTENT.photo; });
  fig.hidden = false; who.hidden = false; grid.classList.add('has-photo');
}

/* =========================================================
   REVEAL ON SCROLL
   ========================================================= */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .12, rootMargin: '0px 0px -6% 0px' }) : null;
function observeReveals() {
  $$('.reveal:not(.in)').forEach(el => io ? io.observe(el) : el.classList.add('in'));
}

/* =========================================================
   TYPEWRITER
   ========================================================= */
let typeToken = 0;
function startTyper() {
  const id = ++typeToken;
  const el = $('#typer');
  const words = CONTENT.typewriter[lang];
  if (reduceMotion) { el.textContent = words[0]; return; }
  let w = 0, i = 0, del = false;
  (function tick() {
    if (id !== typeToken) return;
    const word = words[w];
    if (!del) {
      el.textContent = word.slice(0, ++i);
      if (i >= word.length) { del = true; return setTimeout(tick, 1700); }
      setTimeout(tick, 45 + Math.random() * 45);
    } else {
      el.textContent = word.slice(0, --i);
      if (i <= 0) { del = false; w = (w + 1) % words.length; return setTimeout(tick, 320); }
      setTimeout(tick, 24);
    }
  })();
}

/* =========================================================
   NAV: scroll state, progress, active link, mobile menu
   ========================================================= */
const nav = $('#nav'), progress = $('#progress'), toTop = $('#toTop');

/* =========================================================
   SCROLL SCENE ENGINE  (also drives nav state, #progress, active section)
   ---------------------------------------------------------
   One passive scroll + resize listener -> one requestAnimationFrame
   frame. Rects are cached on refresh/resize; per frame only scrollY is
   read, and only scenes IntersectionObserver marks as near the viewport
   are written.

   data-scene (any value except pin/hscroll, e.g. data-scene="")
       --p = 0 when the element's TOP touches the viewport BOTTOM,
             1 when the element's BOTTOM leaves the viewport TOP.
   data-scene="pin"    pinned/scrubbed scene. Put it on a TALL outer
       wrapper (e.g. height: 300vh) whose child is
       position: sticky; top: 0; height: 100vh.
       --p = 0 when wrapper top reaches viewport top,
             1 when wrapper bottom reaches viewport bottom
             (progress over wrapper height minus viewport height).
   data-scene="hscroll"  horizontal track driven by vertical scroll:
         <div data-scene="hscroll"><div class="h-track"> items </div></div>
       Desktop only (>=1001px + hover + fine pointer, no reduced motion):
       JS adds .is-pinned, sets wrapper height = track overflow + 100vh,
       .h-track sticks and moves by --hx (px, 0 -> -overflow).
       Otherwise: a native horizontal scroll-snap row (no pinning).
       Tune spacing with --h-gap on the wrapper.
   --p                 0..1, clamped, 4 decimals, inline on the element
                       (inherits to children: use calc(var(--p) * ...)).
   .is-active          while the scene intersects the viewport.
   html.reduced        prefers-reduced-motion: every --p = 1 (final
                       state), .is-active always on, nothing pinned.
   window.Scenes.refresh()  re-measure (coalesced into the next frame)
       and pick up newly added [data-scene] elements. Already called after
       renderAll (boot + language switch), fonts, image loads, window
       load, resize and any <body> size change. Refresh never collapses a
       wrapper's height, so a re-measure leaves scrollY unchanged.
   Active section (nav link + rail dot): the last main section[id] whose
       cached top <= scrollY + 45% of the viewport (the last one at page bottom).
   Touch devices: resize events that only change the height by < 120px
       (mobile URL bar showing/hiding) are ignored.
   ========================================================= */
const root = document.documentElement;
const pinMQ = window.matchMedia('(min-width: 1001px) and (hover: hover) and (pointer: fine)');
if (reduceMotion) root.classList.add('reduced');
let scenes = [], vh = window.innerHeight, maxScroll = 1, lastY = -1, ticking = false, needMeasure = true;
let secTops = [], curSec = null;
const nearScenes = new Set();
const sceneIO = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  entries.forEach(e => {
    const s = e.target._scene;
    if (!s) return;
    if (e.isIntersecting) nearScenes.add(s);
    else { nearScenes.delete(s); updateScene(s, window.scrollY); } /* settle at 0 or 1 on exit */
  });
  requestTick();
}, { rootMargin: '50% 0px 50% 0px' }) : null;

function measureScenes() {
  needMeasure = false; lastY = -1;
  vh = window.innerHeight;
  /* drop removed elements, register new ones */
  scenes = scenes.filter(s => { if (s.el.isConnected) return true; nearScenes.delete(s); if (sceneIO) sceneIO.unobserve(s.el); return false; });
  $$('[data-scene]').forEach(el => {
    if (el._scene) return;
    const m = el.dataset.scene;
    const s = { el, mode: m === 'pin' || m === 'hscroll' ? m : 'view', track: m === 'hscroll' ? $('.h-track', el) : null, top: 0, h: 0, dist: 0, p: -1, active: null };
    el._scene = s; scenes.push(s);
    if (reduceMotion) { el.style.setProperty('--p', '1'); el.classList.add('is-active'); }
    else if (sceneIO) sceneIO.observe(el); else nearScenes.add(s);
  });
  if (!reduceMotion) {
    const pinOK = pinMQ.matches;
    const hs = scenes.filter(s => s.mode === 'hscroll');
    /* Never clear the wrapper height before reading: collapsing it clamps scrollY and the page jumps.
       Track scrollWidth and wrapper clientWidth do not depend on the wrapper's height. */
    hs.forEach(s => s.el.classList.toggle('is-pinned', pinOK && !!s.track)); /* write (no-op unless pinOK changed) */
    hs.forEach(s => { s.dist = pinOK && s.track ? Math.max(0, s.track.scrollWidth - s.el.clientWidth) : 0; }); /* read */
    hs.forEach(s => {
      const hgt = s.dist ? (s.dist + vh) + 'px' : '';
      if (s.el.style.height !== hgt) s.el.style.height = hgt;
      if (!s.dist) s.el.style.removeProperty('--hx');
    }); /* write */
    const y = window.scrollY;
    scenes.forEach(s => { const r = s.el.getBoundingClientRect(); s.top = r.top + y; s.h = r.height; s.p = -1; }); /* read */
  }
  const y0 = window.scrollY;
  secTops = $$('main section[id]').map(el => ({ id: el.id, top: el.getBoundingClientRect().top + y0 })); /* read */
  maxScroll = Math.max(1, root.scrollHeight - vh);
}

function updateScene(s, y) {
  if (reduceMotion) return;
  let p;
  if (s.mode === 'view') p = (y + vh - s.top) / (vh + s.h);
  else { const span = s.h - vh; p = span > 0 ? (y - s.top) / span : (y >= s.top ? 1 : 0); }
  p = Math.round((p < 0 ? 0 : p > 1 ? 1 : p) * 10000) / 10000;
  if (p !== s.p) {
    s.p = p;
    s.el.style.setProperty('--p', p);
    if (s.dist) s.el.style.setProperty('--hx', (-p * s.dist).toFixed(1) + 'px');
    if (s.el._onP) s.el._onP(p); /* optional per-scene hook (hero uses it to make faded content inert) */
  }
  const act = s.top < y + vh && s.top + s.h > y;
  if (act !== s.active) { s.active = act; s.el.classList.toggle('is-active', act); }
}

function frame() {
  ticking = false;
  if (needMeasure) measureScenes();
  const y = window.scrollY;
  if (y !== lastY) {
    lastY = y;
    const sp = Math.min(1, Math.max(0, y / maxScroll));
    progress.style.transform = `scaleX(${sp})`;
    nav.classList.toggle('scrolled', y > 12);
    toTop.classList.toggle('show', y > 700);
    updateSection(y);
  }
  nearScenes.forEach(s => updateScene(s, y));
}
function updateSection(y) {
  if (!secTops.length) return;
  let id = secTops[0].id;
  if (y >= maxScroll - 2) id = secTops[secTops.length - 1].id;
  else { const line = y + vh * .45; for (const t of secTops) { if (t.top <= line) id = t.id; else break; } }
  if (id === curSec) return;
  curSec = id;
  const navId = navMap[id];
  $$('.nav-links a').forEach(a => a.classList.toggle('active', !!navId && a.getAttribute('href') === '#' + navId));
  setRail(id);
}
function requestTick() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
const Scenes = { refresh() { needMeasure = true; requestTick(); } };
window.Scenes = Scenes;

window.addEventListener('scroll', requestTick, { passive: true });
const coarseMQ = window.matchMedia('(hover: none) and (pointer: coarse)');
let rzW = window.innerWidth, rzH = window.innerHeight;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  /* touch: a height-only change under 120px is the URL bar showing/hiding -> skip (width/orientation still re-measure) */
  if (coarseMQ.matches && w === rzW && Math.abs(h - rzH) < 120) return;
  rzW = w; rzH = h;
  measureHero(); Scenes.refresh();
}, { passive: true });
window.addEventListener('load', Scenes.refresh);
if (pinMQ.addEventListener) pinMQ.addEventListener('change', Scenes.refresh); else if (pinMQ.addListener) pinMQ.addListener(Scenes.refresh);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(Scenes.refresh);
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') Scenes.refresh(); }, true);
if ('ResizeObserver' in window) new ResizeObserver(Scenes.refresh).observe(document.body);
requestTick();

/* =========================================================
   CINEMATIC SCENES: hero pin sizing, split headings, cert gallery focus
   (all motion itself is CSS driven by --p; this only measures and toggles)
   ========================================================= */
const heroPin = $('#home'), heroSticky = $('.hero', heroPin), heroText = $('.hero-text', heroPin);
/* The hero card can be taller than the viewport (phones, short laptops). The pin wrapper is sized
   from its real height and .hero sticks with a negative top, so the card's bottom (CTAs, meta) is
   always scrolled into view before the pinned scrub starts. */
let heroP0 = 0;
function measureHero() {
  const h = heroSticky.offsetHeight;
  heroPin.style.setProperty('--hero-h', h + 'px');
  const top = Math.min(0, window.innerHeight - h);
  heroPin.style.setProperty('--hero-top', top + 'px');
  /* clearly taller than the screen (short phones): the bottom-pinned scroll hint would sit on Echo -> hidden (CSS) */
  heroPin.classList.toggle('is-tall', top < -48);
  /* share of the pin's --p that is plain page scroll before .hero sticks (span = wrapper height - viewport) */
  const span = heroPin.offsetHeight - window.innerHeight;
  heroP0 = !reduceMotion && span > 0 ? Math.min(.9, -top / span) : 0;
