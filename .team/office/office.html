<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Ofisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1016; --panel:#171B24; --line:#2A3040; --ink:#EEF0F5; --soft:#9AA3B5; --faint:#5E6779;
  --wall:#2B3243; --wall-2:#252B3A; --trim:#3A4258; --floor-a:#5B4535; --floor-b:#54402F;
  --claude:#E8875F; --eko:#5B8CFF; --meko:#34C77B; --reko:#B87BFF; --sako:#F4B942;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:20px}
h1 small{display:block;font-size:11px;font-weight:600;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:8px;font:600 12px JetBrains Mono,monospace;color:var(--soft);background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#34C77B;animation:ping 1.6s infinite}
.live.off i{background:#E5484D;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 #34C77B99}70%,100%{box-shadow:0 0 0 8px transparent}}

.layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:1fr}}

/* ---------- the room ---------- */
.room{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--floor-a);box-shadow:0 30px 60px -30px #000}
.wall{position:relative;height:150px;background:linear-gradient(180deg,var(--wall),var(--wall-2));border-bottom:10px solid var(--trim);display:flex;align-items:flex-end;justify-content:space-around;padding:0 24px 14px;gap:16px}
.window{width:200px;height:110px;border:6px solid #4A5370;border-radius:6px;position:relative;overflow:hidden;background:var(--sky,#8EC5F2);flex:none}
.window::before,.window::after{content:"";position:absolute;background:#4A5370}
.window::before{left:50%;top:0;bottom:0;width:5px;margin-left:-2px}
.window::after{top:50%;left:0;right:0;height:5px;margin-top:-2px}
.sun{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--orb,#FFE08A);box-shadow:0 0 20px var(--orb,#FFE08A);left:var(--ox,60%);top:var(--oy,22%)}
.cloud{position:absolute;height:12px;width:46px;border-radius:12px;background:#fff;opacity:var(--co,.85);animation:drift 40s linear infinite}
.cloud.c2{top:60%;width:34px;animation-duration:55s;animation-delay:-20s}
.cloud.c1{top:20%}
@keyframes drift{from{left:-60px}to{left:220px}}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:var(--so,0)}
.board{width:260px;height:118px;background:#F4F5F7;border:6px solid #8A93A8;border-radius:6px;padding:8px 12px;color:#2B3243;font:600 11px JetBrains Mono,monospace;flex:none}
.board b{display:block;font:700 12px Inter;color:#2448C4;margin-bottom:5px}
.board div{display:flex;justify-content:space-between;line-height:1.55}
.board span.ok{color:#12A877}.board span.run{color:#B07A00}.board span.no{color:#9AA0AC}
.clock{width:62px;height:62px;border-radius:50%;background:#F4F5F7;border:5px solid #8A93A8;position:relative;flex:none;align-self:center}
.clock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#2B3243;border-radius:2px}
.clock .h{width:4px;height:15px;margin-left:-2px}.clock .m{width:3px;height:21px;margin-left:-1.5px}.clock .s{width:1.5px;height:23px;margin-left:-.75px;background:#E5484D}
.plant-big{width:50px;flex:none;align-self:flex-end}
@media (max-width:760px){.board,.plant-big{display:none}.window{width:150px}}

.floor{padding:26px 18px 30px;background:
  repeating-linear-gradient(90deg,transparent 0 119px,rgba(0,0,0,.18) 119px 121px),
  repeating-linear-gradient(0deg,var(--floor-a) 0 34px,var(--floor-b) 34px 36px);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px 18px}
.rug{grid-column:1/-1;display:flex;justify-content:center}
.lead-spot{width:min(100%,360px)}

.station{position:relative;--c:var(--soft)}
.station svg.scene{width:100%;height:auto;display:block;overflow:visible}
.tag{margin-top:6px;background:rgba(12,14,19,.82);backdrop-filter:blur(4px);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:12px;padding:9px 11px}
.tag .row{display:flex;align-items:center;gap:8px}
.tag .nm{font-weight:700;color:var(--c)}
.tag .rl{font-size:11px;color:var(--soft)}
.chip{margin-left:auto;font:600 10.5px JetBrains Mono,monospace;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.chip.idle{background:#ffffff10;color:var(--faint)}
.tag .tk{font-size:11.5px;color:var(--soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag .tm{font:10.5px JetBrains Mono,monospace;color:var(--faint);margin-top:4px}

/* screen */
.screen{width:100%;height:100%;background:#0A0C11;font:7px/1.35 JetBrains Mono,monospace;color:#D7DCE6;padding:4px 5px;overflow:hidden;position:relative}
.screen .code{position:absolute;inset:4px 5px 22px;overflow:hidden;opacity:0;transition:opacity .4s}
.screen .code p{margin:0 0 2.5px;height:3px;border-radius:2px;background:var(--c);opacity:.55}
.screen .code p:nth-child(3n){opacity:.25}.screen .code p:nth-child(4n){background:#D7DCE6;opacity:.3}
.screen .code .track{animation:scroll 3.2s linear infinite}
@keyframes scroll{to{transform:translateY(-50%)}}
.screen .msg{position:absolute;left:5px;right:5px;bottom:3px;max-height:20px;overflow:hidden;color:var(--c);font-weight:600}
.screen .msg::after{content:"▍";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.screen .big{position:absolute;inset:0;display:none;place-items:center;font:700 18px Inter;color:var(--c)}
.st-active .screen .code{opacity:1}
.st-done .screen .big{display:grid}.st-done .screen .code{opacity:.15}
.st-idle .screen{background:#050608}.st-idle .screen *{display:none}
.st-waiting .screen .code{opacity:.35}.st-waiting .screen .code .track{animation-duration:12s}

/* person */
.person{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.st-idle .person{opacity:0}
.armL,.armR{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s}
.st-active .armL{animation:typeL .28s ease-in-out infinite alternate}
.st-active .armR{animation:typeR .28s ease-in-out infinite alternate .14s}
@keyframes typeL{to{transform:translateY(-2.5px) rotate(-2deg)}}
@keyframes typeR{to{transform:translateY(-2.5px) rotate(2deg)}}
.st-thinking .armL,.st-thinking .armR{animation:none}
.st-thinking .armR{transform:rotate(28deg) translateY(-4px)}
.head{transform-box:fill-box;transform-origin:50% 90%}
.st-reading .head,.st-thinking .head{animation:nod 2.4s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(4deg)}}
.st-waiting .person{transform:rotate(-5deg) translateY(2px)}
.st-waiting .armL,.st-waiting .armR{transform:translateY(14px) scaleY(.4)}
.st-done .armL{animation:cheerL 1.2s ease-out 2}
.st-done .armR{animation:cheerR 1.2s ease-out 2}
@keyframes cheerL{30%,70%{transform:translateY(-22px) rotate(-30deg)}}
@keyframes cheerR{30%,70%{transform:translateY(-22px) rotate(30deg)}}
.st-blocked .person{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{to{transform:translateX(2px)}}

/* bubbles */
.bub{opacity:0;transition:opacity .3s}
.st-thinking .bub-think,.st-blocked .bub-alert,.st-done .bub-done,.st-waiting .steam{opacity:1}
.bub-think circle{animation:dots 1.2s ease-in-out infinite}
.bub-think circle:nth-child(3){animation-delay:.2s}.bub-think circle:nth-child(4){animation-delay:.4s}
@keyframes dots{50%{transform:translateY(-2px);opacity:.4}}
.steam path{animation:steam 2s ease-in-out infinite;opacity:.6}
.steam path:nth-child(2){animation-delay:.7s}
@keyframes steam{0%{transform:translateY(3px);opacity:0}50%{opacity:.7}100%{transform:translateY(-6px);opacity:0}}
.lamp{opacity:.12;transition:opacity .5s}
.st-active .lamp{opacity:.32}

/* feed */
.feed{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.feed h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.feed ol{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:7px}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:8px 10px;border-radius:10px;background:#ffffff06;border-left:3px solid var(--c)}
.feed li.new{animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateX(8px)}}
.feed .who{font:700 12px Inter;color:var(--c)}
.feed .t{font:10.5px JetBrains Mono,monospace;color:var(--faint);text-align:right}
.feed .m{grid-column:1/-1;font-size:12.5px;color:#C9CFDA}
.empty{color:var(--faint);font-size:12px;padding:8px;border:0!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agent Ofisi <small>Portfolio · Raund 5: yeni stil + Echo</small></h1>
    <div class="live" id="live"><i></i><span>CANLI</span></div>
  </header>
  <div class="layout">
    <div class="room">
      <div class="wall">
        <div class="window" id="win"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>
        <div class="clock" id="clock"><i class="h"></i><i class="m"></i><i class="s"></i></div>
        <div class="board" id="board"><b>RAUND 5 · plan</b></div>
        <svg class="plant-big" viewBox="0 0 50 110"><path d="M25 70 C10 50 4 30 14 14 C20 30 24 46 25 70Z M25 70 C40 52 46 34 38 18 C31 34 27 50 25 70Z M25 72 C14 62 2 60 0 52 C12 50 22 58 25 72Z M25 72 C36 62 48 60 50 52 C38 50 28 58 25 72Z" fill="#3FA36A"/><path d="M12 72h26l-4 36H16z" fill="#C46B4E"/><rect x="10" y="70" width="30" height="6" rx="2" fill="#D9805F"/></svg>
      </div>
      <div class="floor" id="floor"></div>
    </div>
    <aside class="feed"><h2>Hadisələr lenti</h2><ol id="feed"><li class="empty">Hələ heç nə yoxdur…</li></ol></aside>
  </div>
</div>
<script>
const TEAM = [
  { id:'claude', name:'Claude', role:'Lider · koordinasiya', lead:true, hair:'#3B2A20', skin:'#E9B98F' },
  { id:'eko',    name:'Eko',    role:'UI/UX · yeni stil',      hair:'#1E1E24', skin:'#D9A47A' },
  { id:'reko',   name:'Reko',   role:'Animator · Echo',        hair:'#7A3E1C', skin:'#F0C6A0' },
  { id:'meko',   name:'Meko',   role:'Funksiyalar · hərəkət',  hair:'#C9A24A', skin:'#E2B088' },
  { id:'sako',   name:'Sako',   role:'QA · test',              hair:'#2D2438', skin:'#C98F68' },
];
const STATE = { assigned:'tapşırıq aldı', thinking:'düşünür', reading:'kodu oxuyur', working:'işləyir', testing:'test edir', waiting:'gözləyir', done:'bitirdi', blocked:'ilişdi', idle:'masada yoxdur' };
const ACTIVE = new Set(['assigned','reading','working','testing']);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (ts, now) => { const s=Math.max(0,Math.round((now-ts)/1000)); return s<60? s+' san əvvəl' : Math.floor(s/60)+' dəq əvvəl'; };

function codeLines(){ let p=''; for(let i=0;i<24;i++) p+=`<p style="width:${20+Math.round(Math.random()*75)}%;margin-left:${(i%5===0?0:(i%3)*8)}%"></p>`; return p+p; }

function stationSVG(a){
  const c = `var(--${a.id})`;
  return `<svg class="scene" viewBox="0 0 240 200" aria-hidden="true">
    <ellipse cx="120" cy="194" rx="96" ry="6" fill="#000" opacity=".22"/>
    <!-- desk -->
    <rect x="14" y="100" width="212" height="12" rx="3" fill="#B08A66"/>
    <rect x="14" y="108" width="212" height="5" fill="#8F6D4F"/>
    <rect x="22" y="113" width="8" height="74" fill="#6E5440"/><rect x="210" y="113" width="8" height="74" fill="#6E5440"/>
    <rect x="22" y="113" width="44" height="34" rx="2" fill="#7D604A"/><rect x="40" y="127" width="10" height="3" rx="1.5" fill="#C9A884"/>
    <!-- lamp glow + monitor -->
    <ellipse class="lamp" cx="120" cy="62" rx="70" ry="50" fill="${c}"/>
    <rect x="112" y="86" width="16" height="12" fill="#2A2F3A"/><rect x="100" y="96" width="40" height="5" rx="2" fill="#2A2F3A"/>
    <rect x="56" y="14" width="128" height="76" rx="6" fill="#1B1F27" stroke="#343B4A"/>
    <foreignObject x="62" y="20" width="116" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="screen" style="--c:${c}">
      <div class="code"><div class="track">${codeLines()}</div></div><div class="msg"></div><div class="big">✓ bitdi</div></div></foreignObject>
    <!-- desk items -->
    <g transform="translate(190 84)"><rect x="0" y="2" width="14" height="15" rx="3" fill="#E9ECF2"/><path d="M14 6 q6 0 6 5 q0 5 -6 5" fill="none" stroke="#E9ECF2" stroke-width="2.5"/>
      <g class="steam bub"><path d="M4 0 q-3 -4 0 -8 q3 -4 0 -8" stroke="#fff" fill="none" stroke-width="1.5"/><path d="M10 0 q-3 -4 0 -8 q3 -4 0 -8" stroke="#fff" fill="none" stroke-width="1.5"/></g></g>
    <g transform="translate(28 66)"><path d="M10 26 C2 16 2 6 8 0 C11 10 12 18 10 26Z M10 26 C18 16 20 8 15 2 C12 12 10 18 10 26Z" fill="#3FA36A"/><rect x="3" y="24" width="15" height="11" rx="2" fill="#E9ECF2"/></g>
    <rect x="160" y="96" width="16" height="4" rx="2" fill="#E9ECF2" opacity=".8"/>
    <!-- person (back view) -->
    <g class="person">
      <g class="armL"><rect x="92" y="98" width="11" height="26" rx="5.5" fill="${c}"/><circle cx="97.5" cy="99" r="5" fill="${a.skin}"/></g>
      <g class="armR"><rect x="137" y="98" width="11" height="26" rx="5.5" fill="${c}"/><circle cx="142.5" cy="99" r="5" fill="${a.skin}"/></g>
      <rect x="94" y="114" width="52" height="56" rx="20" fill="${c}"/>
      <rect x="94" y="114" width="52" height="56" rx="20" fill="#000" opacity=".12"/>
      <rect x="114" y="106" width="12" height="12" fill="${a.skin}"/>
      <g class="head"><circle cx="104" cy="98" r="4.5" fill="${a.skin}"/><circle cx="136" cy="98" r="4.5" fill="${a.skin}"/>
        <circle cx="120" cy="94" r="17" fill="${a.hair}"/><path d="M104 90 q16 -14 32 0" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
        ${a.lead?'<path d="M103 86 a17 17 0 0 1 34 0" fill="none" stroke="#1B1F27" stroke-width="4"/><rect x="99" y="86" width="8" height="12" rx="3" fill="#1B1F27"/><rect x="133" y="86" width="8" height="12" rx="3" fill="#1B1F27"/>':''}</g>
    </g>
    <!-- chair -->
    <rect x="88" y="134" width="64" height="44" rx="10" fill="#262B36"/>
    <rect x="88" y="134" width="64" height="6" rx="3" fill="${c}" opacity=".8"/>
    <text x="120" y="162" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="${c}">${a.name}</text>
    <rect x="116" y="178" width="8" height="9" fill="#1E222B"/><path d="M96 191 h48" stroke="#1E222B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="98" cy="193" r="3" fill="#11141A"/><circle cx="142" cy="193" r="3" fill="#11141A"/>
    <!-- bubbles -->
    <g class="bub bub-think" transform="translate(150 52)"><rect x="0" y="0" width="34" height="18" rx="9" fill="#fff"/><circle cx="10" cy="9" r="2.4" fill="#2B3243"/><circle cx="17" cy="9" r="2.4" fill="#2B3243"/><circle cx="24" cy="9" r="2.4" fill="#2B3243"/><circle cx="2" cy="24" r="3" fill="#fff"/></g>
    <g class="bub bub-alert" transform="translate(152 46)"><circle r="12" cx="12" cy="12" fill="#E5484D"/><text x="12" y="17" text-anchor="middle" font-family="Inter" font-weight="800" font-size="15" fill="#fff">!</text></g>
    <g class="bub bub-done" transform="translate(152 46)"><circle r="12" cx="12" cy="12" fill="#12A877"/><path d="M6 12 l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  </svg>`;
}

const floor = document.getElementById('floor');
const nodes = {};
TEAM.forEach(a=>{
  const st=document.createElement('div'); st.className='station st-idle'; st.style.setProperty('--c',`var(--${a.id})`);
  st.innerHTML = stationSVG(a) + `<div class="tag"><div class="row"><span class="nm">${a.name}</span><span class="rl">${a.role}</span><span class="chip idle">masada yoxdur</span></div><div class="tk"></div><div class="tm"></div></div>`;
  if(a.lead){ const r=document.createElement('div'); r.className='rug'; const s=document.createElement('div'); s.className='lead-spot'; s.appendChild(st); r.appendChild(s); floor.appendChild(r); }
  else floor.appendChild(st);
  nodes[a.id] = { st, msg: st.querySelector('.msg'), chip: st.querySelector('.chip'), tk: st.querySelector('.tk'), tm: st.querySelector('.tm'), text:'', timer:null };
});

function typeOut(n, text){
  if(n.text===text) return; n.text=text; clearInterval(n.timer);
  let i=0; n.msg.textContent='';
  n.timer=setInterval(()=>{ i+=2; n.msg.textContent=text.slice(0,i); if(i>=text.length) clearInterval(n.timer); }, 35);
}

// window sky + clock follow real time
function sky(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60, w=document.getElementById('win');
  const day = h>=7 && h<18, dusk = (h>=18&&h<20)||(h>=6&&h<7);
  w.style.setProperty('--sky', day? 'linear-gradient(#7FB8EE,#BFE0FA)' : dusk? 'linear-gradient(#4B3B6B,#E3936B)' : 'linear-gradient(#0B1330,#1E2A55)');
  w.style.setProperty('--orb', day||dusk? '#FFE08A' : '#E8ECF7');
  const t = day? (h-7)/11 : 0.5;
  w.style.setProperty('--ox', (8+t*70)+'%'); w.style.setProperty('--oy', (day? 40-Math.sin(t*Math.PI)*28 : 18)+'%');
  w.style.setProperty('--co', day? .85 : .15);
  if(!w.dataset.stars){ w.dataset.stars=1; for(let i=0;i<14;i++){ const s=document.createElement('i'); s.className='star'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*90+'%'; w.appendChild(s);} }
  w.querySelectorAll('.star').forEach(s=>s.style.setProperty('--so', day||dusk? 0 : .8));
  const c=document.getElementById('clock'), m=d.getMinutes(), sec=d.getSeconds();
  c.querySelector('.h').style.transform=`rotate(${(h%12)*30}deg)`;
  c.querySelector('.m').style.transform=`rotate(${m*6+sec*.1}deg)`;
  c.querySelector('.s').style.transform=`rotate(${sec*6}deg)`;
}
sky(); setInterval(sky,1000);

let lastFeed='';
async function tick(){
  const live=document.getElementById('live');
  try{
    const s = await (await fetch('/api',{cache:'no-store'})).json();
    live.classList.remove('off'); live.querySelector('span').textContent='CANLI';
    let board='<b>RAUND 5 · plan</b>';
    TEAM.forEach(a=>{
      const r=s.agents[a.id], n=nodes[a.id], state=r? r.state : 'idle';
      n.st.className='station st-'+state+(ACTIVE.has(state)?' st-active':'');
      n.chip.textContent=STATE[state]||state; n.chip.className='chip'+(state==='idle'?' idle':'');
      n.tk.textContent = r&&r.task? 'Tapşırıq: '+r.task : '';
      n.tm.textContent = r? ago(r.ts, s.now)+' · '+r.steps+' addım' : '';
      typeOut(n, r? r.msg : '');
      const cls = state==='done'?'ok': (state==='idle'||state==='waiting')?'no':'run';
      board += `<div><span>${a.name}</span><span class="${cls}">${state==='done'?'✓ bitdi':esc(STATE[state]||state)}</span></div>`;
    });
    document.getElementById('board').innerHTML=board;
    const key = s.feed.length? s.feed[s.feed.length-1].ts+':'+s.feed.length : '';
    if(key!==lastFeed){
      const first = lastFeed===''; lastFeed=key;
      const ol=document.getElementById('feed');
      ol.innerHTML = s.feed.length? s.feed.slice().reverse().map((e,i)=>{
        const t=TEAM.find(x=>x.id===e.agent)||{name:e.agent};
        const time=new Date(e.ts).toLocaleTimeString('az',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
        return `<li class="${!first&&i===0?'new':''}" style="--c:var(--${esc(e.agent)})"><span class="who">${esc(t.name)} · ${esc(STATE[e.state]||e.state)}</span><span class="t">${time}</span><span class="m">${esc(e.msg)}</span></li>`;
      }).join('') : '<li class="empty">Hələ heç nə yoxdur…</li>';
    }
  }catch(e){ live.classList.add('off'); live.querySelector('span').textContent='BAĞLANTI YOXDUR'; }
}
tick(); setInterval(tick,1200);
</script>
</body>
